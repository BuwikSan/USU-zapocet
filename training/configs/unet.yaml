# Config pro U-Net trénink - vlastní soubor, hodnoty vycházejí z
# Modely/vertebra_segmentation_and_keypoint_extraction-main/Src/Atlas/training/configs/atlas_multiclass_patch.yaml
# (channels/strides/num_res_units/augmentace 1:1 stejné - jen patch 256 místo 512
# a patches_per_image 8 místo 20, viz devnotes/dodatek k trénování.md).

run:
  name: unet-atlas-v1
  seed: 42
  max_epochs: 60
  full_val_every: 5
  max_minutes: null   # nastavit přes --max-minutes při spuštění na omezené noční okno

data:
  patch_size: 256
  patches_per_image: 8
  train_batch_size: 8
  # Měření ukázalo, že pipeline byla omezená CPU (GPU čekalo na data, 0% vytížení).
  # 8 workerů + předpočítané CLAHE to obrací na výpočetně vázané.
  # Na stroji s méně jádry klidně snížit — nemá to vliv na výsledek, jen na rychlost.
  num_workers: 8
  heqv: true
  use_precomputed_heqv: true   # čte z Inputdata/datasets-PNG-heqv (scripts/precompute_heqv.py)
  # Cílené vzorkování výřezů: 80 % výřezů se vystředí na obratel, 20 % na pozadí.
  # Obratle zabírají jen ~3 % plochy snímku, takže při rovnoměrně náhodném
  # vzorkování 15,6 % výřezů neobsahovalo vůbec žádné popředí. Ověřeno, že to
  # pomáhá OBĚMA modelům (U-Net 0,883 -> 0,897; UNETR 0,078 -> 0,182 při jinak
  # shodných podmínkách), proto je to nastavené stejně u obou — datová pipeline
  # musí zůstat identická, jinak by srovnání architektur nic neznamenalo.
  crop_strategy: pos_neg
  pos_ratio: 0.8

optimizer:
  # Původní repozitář měl 0.01, ale s naší konfigurací (patch 256, batch 8, AMP)
  # to na reálných datech po ~200 krocích spolehlivě zdiverguje na loss=nan
  # (ověřeno, zachyceno nan-pojistkou v loop.py). 1e-3 je standardní hodnota
  # pro Adam a drží se stabilně.
  lr: 0.001

scheduler:
  kind: cosine   # "cosine" nebo "plateau"
  t0: 5
  t_mult: 2
  eta_min: 1.0e-8
  plateau_patience: 5
  plateau_ratio: 0.8

transforms:
  rand_flip_prob: 0.5
  rand_rotate90_prob: 0.5
  rand_rotate90_max_k: 3
  rand_zoom_min: 0.9
  rand_zoom_max: 1.1
  rand_zoom_prob: 0.3
  rand_gaussian_noise_prob: 0.2

validation:
  sw_batch_size: 4
  sw_overlap: 0.25

amp: true
