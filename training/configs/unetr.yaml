# Config pro UNETR trénink - stejné run/data/scheduler/transforms/validation
# hodnoty jako unet.yaml (kontrolovaný experiment, viz devnotes/teorie/03_..md
# kap. 3.5), liší se jen run.name a nižší max_epochs (UNETR je ~8x dražší na krok,
# viz benchmark_training_step.py).

run:
  name: unetr-atlas-v1
  seed: 42
  # Stejny pocet epoch jako U-Net — zamerne. Kazdy model by sice konvergoval
  # jinak rychle (U-Net je temer na stropu uz po par epochach, UNETR stoupa
  # dele), ale shodny pocet epoch je pri obhajobe jednoznacnejsi: lisi se
  # architektura, ne rozpocet treninku.
  max_epochs: 60
  full_val_every: 5
  max_minutes: null

model:
  # Velikost Vision Transformeru uvnitr UNETR (viz training/common/models.py::VIT_SIZES).
  #
  # Vychozi hodnota MONAI je "base" (ViT-Base, 116 M parametru) — tedy velikost
  # z puvodni publikace UNETR, kde ale trenovali na radove vetsich datech.
  # Na nasich 2978 snimcich to znamena 72x vic parametru nez ma U-Net (1,6 M),
  # a zkusebni behy ukazaly, ze se takovy model nema jak rozjet.
  #
  # "tiny" (8,4 M) je kapacitne blizko U-Netu, takze je srovnani architektur
  # poctivejsi, a navic je 2,4x rychlejsi -> vic epoch za stejny cas.
  # Merene srovnani za jinak identickych podminek (400 snimku, 10 epoch):
  #     ViT-base  val Dice 0,182
  #     ViT-tiny  val Dice 0,400
  vit_size: tiny

data:
  patch_size: 256
  patches_per_image: 8
  train_batch_size: 8
  num_workers: 8
  heqv: true
  use_precomputed_heqv: true   # viz komentář v unet.yaml
  crop_strategy: pos_neg       # MUSÍ být stejné jako u U-Netu, viz komentář v unet.yaml
  pos_ratio: 0.8

optimizer:
  # POZOR: 0.01 (hodnota vyladěná pro malý CNN v atlas_multiclass_patch.yaml) na
  # UNETR (116M parametrů, self-attention) po ~1 epoše diverguje na loss=nan -
  # ověřeno smoke testem (training/train_unetr.py --limit-train 4 --max-epochs 2).
  # 1e-4 je hodnota z originální UNETR publikace (Hatamizadeh et al., 2021) a je
  # to běžný řád LR pro Vision Transformery obecně - viz devnotes/teorie/02_...md.
  # 3e-4 místo 1e-4: ověřeno krátkými běhy (scripts/tune_unetr.py). Samotné
  # zvýšení LP při náhodných výřezech ale NEPOMOHLO (bylo horší než 1e-4) —
  # zabralo až v kombinaci s cíleným vzorkováním výřezů a rozjezdem.
  lr: 3.0e-4

scheduler:
  kind: cosine
  # t0 15 místo 5: s krátkým cyklem klesl learning rate do epochy 4 na ~1e-5 a
  # UNETR se prakticky zastavil dřív, než se stihl rozjet. Delší cyklus než
  # plánovaný počet epoch znamená prakticky monotónně klesající LR bez restartů.
  t0: 15
  t_mult: 2
  eta_min: 1.0e-8
  plateau_patience: 5
  plateau_ratio: 0.8
  # Dvouepochový lineární rozjezd LR od nuly. U transformerů standard —
  # náhodně inicializovaná attention dává zpočátku divoké gradienty.
  # U-Net to nepotřebuje (má warmup_epochs 0, tedy vypnuto).
  warmup_epochs: 2

transforms:
  rand_flip_prob: 0.5
  rand_rotate90_prob: 0.5
  rand_rotate90_max_k: 3
  rand_zoom_min: 0.9
  rand_zoom_max: 1.1
  rand_zoom_prob: 0.3
  rand_gaussian_noise_prob: 0.2

validation:
  sw_batch_size: 4
  sw_overlap: 0.25

amp: true
